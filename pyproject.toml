[project]
name = "devdocs-mcp-server"
version = "0.1.0"
description = "MCP server for searching and reading DevDocs documentation"
authors = [
    {name = "Jiajie Chen",email = "c@jia.je"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastmcp>=4.1.3",
    "markdownify>=1.2.3",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
devdocs = "devdocs_mcp_server.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "devdocs_mcp_server"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
ruff = "^0.17.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
